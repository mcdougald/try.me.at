<svg xmlns="http://www.w3.org/2000/svg" width="880" height="281" viewBox="0 0 880 281" role="img" aria-label="try.me.at at a glance: Every app, one gallery, 50 tools in your browser, Shareable by URL, Isolated by design">
<rect x="0.5" y="0.5" width="879" height="280" rx="12" fill="#0a0a0a" stroke="#262626"/>
<rect x="24" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#404040" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="44" dy="0">Every app, one</tspan><tspan x="44" dy="22">gallery</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="44" dy="0">A preview card for</tspan><tspan x="44" dy="21">every public *.me.at</tspan><tspan x="44" dy="21">app, marked live only</tspan><tspan x="44" dy="21">when it is actually</tspan><tspan x="44" dy="21">hosted.</tspan></text>
<rect x="236" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#404040" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="256" dy="0">50 tools in</tspan><tspan x="256" dy="22">your browser</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="256" dy="0">Decoders, hashes,</tspan><tspan x="256" dy="21">converters and</tspan><tspan x="256" dy="21">inspectors that run</tspan><tspan x="256" dy="21">client-side, with no</tspan><tspan x="256" dy="21">backend at all.</tspan></text>
<rect x="448" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#404040" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="468" dy="0">Shareable by</tspan><tspan x="468" dy="22">URL</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="468" dy="0">Each tool keeps its</tspan><tspan x="468" dy="21">inputs in the URL, so</tspan><tspan x="468" dy="21">it survives a reload</tspan><tspan x="468" dy="21">and can be sent as a</tspan><tspan x="468" dy="21">link.</tspan></text>
<rect x="660" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#404040" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="680" dy="0">Isolated by</tspan><tspan x="680" dy="22">design</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="680" dy="0">Each sandbox loads on</tspan><tspan x="680" dy="21">demand in its own</tspan><tspan x="680" dy="21">error boundary, and</tspan><tspan x="680" dy="21">code runs in a</tspan><tspan x="680" dy="21">network-less frame.</tspan></text>
</svg>
