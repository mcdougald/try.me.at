<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-label="How try.me.at works: Pick, then Load, then Run, then Share, then Embed">
<rect x="0.5" y="0.5" width="879" height="231" rx="12" fill="#0a0a0a" stroke="#262626"/>
<rect x="24" y="24" width="144" height="145" rx="10" fill="#171717" stroke="#262626"/>
<text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">01</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="40" dy="0">Pick</tspan></text>
<text x="40" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="40" dy="0">An app preview</tspan><tspan x="40" dy="19">or a sandbox.</tspan></text>
<path d="M174 96.5 H188" stroke="#525252" stroke-width="1.5"/><path d="M184 92.5 L190 96.5 L184 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="196" y="24" width="144" height="145" rx="10" fill="#171717" stroke="#262626"/>
<text x="212" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">02</text>
<text x="212" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="212" dy="0">Load</tspan></text>
<text x="212" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="212" dy="0">Only that tool's</tspan><tspan x="212" dy="19">chunk is</tspan><tspan x="212" dy="19">fetched.</tspan></text>
<path d="M346 96.5 H360" stroke="#525252" stroke-width="1.5"/><path d="M356 92.5 L362 96.5 L356 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="368" y="24" width="144" height="145" rx="10" fill="#171717" stroke="#262626"/>
<text x="384" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">03</text>
<text x="384" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="384" dy="0">Run</tspan></text>
<text x="384" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="384" dy="0">Everything</tspan><tspan x="384" dy="19">computes in your</tspan><tspan x="384" dy="19">browser.</tspan></text>
<path d="M518 96.5 H532" stroke="#525252" stroke-width="1.5"/><path d="M528 92.5 L534 96.5 L528 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="540" y="24" width="144" height="145" rx="10" fill="#171717" stroke="#262626"/>
<text x="556" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">04</text>
<text x="556" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="556" dy="0">Share</tspan></text>
<text x="556" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="556" dy="0">Inputs live in</tspan><tspan x="556" dy="19">the URL, ready</tspan><tspan x="556" dy="19">to send.</tspan></text>
<path d="M690 96.5 H704" stroke="#525252" stroke-width="1.5"/><path d="M700 92.5 L706 96.5 L700 100.5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="712" y="24" width="144" height="145" rx="10" fill="#fafafa"/>
<text x="728" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0a0a0a" opacity="0.6">05</text>
<text x="728" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="728" dy="0">Embed</tspan></text>
<text x="728" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0a0a0a" opacity="0.8"><tspan x="728" dy="0">Any sandbox</tspan><tspan x="728" dy="19">renders bare at</tspan><tspan x="728" dy="19">/embed/&lt;id&gt;.</tspan></text>

<text x="24" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="24" dy="0">There is no backend, so what you type stays on the page.</tspan></text>
